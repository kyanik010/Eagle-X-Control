name: Deploy EAGLE X Control to GitHub Pages

on:
  push:
    branches:
      - feature/eagle-sonix-control-parity
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eagle-x-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EAGLE X control branch
        uses: actions/checkout@v4
        with:
          ref: feature/eagle-sonix-control-parity

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
